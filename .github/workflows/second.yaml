name: Manual and Scheduled Trigger Workflow

on:
  # Manual trigger with a prompt in the GitHub UI
  workflow_dispatch:
    inputs:
      message:
        description: 'Enter a custom message (optional)'
        required: false
        default: 'odiyamma bunty'

  # Scheduled trigger (runs every Monday at midnight UTC)
  schedule:
    # This uses POSIX cron syntax: minute hour day(month) month day(week)
    - cron: '0 0 * * 1'

jobs:
  display_message:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step to display the message
      - name: Print custom message
        run: |
          # Use the input message if the workflow was triggered manually,
          # otherwise use the default message for scheduled runs.
          MESSAGE_TO_DISPLAY="${{ github.event.inputs.message || 'odiyamma bunty' }}"
          echo "GitHub Taskflow Message: $MESSAGE_TO_DISPLAY"
